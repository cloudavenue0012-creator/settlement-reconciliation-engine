name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Generate synthetic data
        run: python synth_data.py -n 2000 --seed 42

      - name: Reconcile
        run: python reconcile.py

      - name: Eval — gate on quality (F1 >= 0.93, recall >= 0.99)
        run: python eval.py --min-f1 0.93 --min-recall 0.99

      - name: Explanation faithfulness (catches hallucinated figures)
        run: python explain.py --demo-hallucination

      - name: Rule-change gate - three named scenarios give the expected verdicts
        run: python rule_change_gate.py

      - name: Rule-change gate - eval (side-effect detection >= 0.90, false alarms 0)
        run: python eval_rule_change.py --min-detect 0.90 --max-false-alarm 0.0

      - name: Three-way reconciliation - eval (location accuracy >= 0.96, false alarm <= 1%, engine cell found)
        run: python eval_three_way.py --min-location-acc 0.96 --max-false-alarm 0.01 --min-cell-id 1.0
